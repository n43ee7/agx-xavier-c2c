# C2C link configuration (written by setup_slave.sh)
role=slave
key_file=/etc/c2c/c2c.key
device=/dev/c2c0
ifname=c2c0
master_ip=10.77.0.1
slave_ip=10.77.0.2
prefix=30
mtu=65000

# heartbeat: link declared lost after dead_ms without traffic
ping_ms=500
dead_ms=3000
hello_ms=1000
reject_backoff_ms=5000
txq_bytes=4194304
gadget_mode=exclusive
