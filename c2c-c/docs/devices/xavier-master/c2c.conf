# C2C link configuration (written by setup_master.sh)
role=master
key_file=/etc/c2c/c2c.key
device=/dev/c2c0
ifname=c2c0
master_ip=10.77.0.1
slave_ip=10.77.0.2
prefix=30
mtu=65000

# heartbeat: link declared lost after dead_ms without traffic
ping_ms=500
dead_ms=3000
# after traffic, poll without sleeping this long (lower round-trip latency)
busy_poll_us=200
hello_ms=1000
reject_backoff_ms=5000
txq_bytes=4194304
gadget_mode=exclusive
# raw USB data channels (/dev/c2cchN) next to the link: the remote GPU's
# data path without TCP/IP or c2cd (see: c2c config show)
raw_channels=4
gpu_transport=auto
gpu_spin_us=1000
gpud_spin_us=1000
gpud_download_buffer_mib=512
gpud_keep_power_gating=no
gpu_system_wide=no
rmem_lend_gib=0
rmem_auto=no
rmem_page_cluster=7
clocks_at_boot=yes

